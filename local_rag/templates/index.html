<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 문서 챗봇</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">R</span><div><strong>RAG Chat</strong><small>PDF 문서 도우미</small></div></div>
      <label class="upload-button" for="pdf-input">＋ PDF 업로드</label>
      <input id="pdf-input" type="file" accept="application/pdf,.pdf" multiple hidden>
      <div id="upload-status" class="upload-status" aria-live="polite">여러 PDF를 한 번에 선택할 수 있습니다.</div>
      <div id="file-list" class="file-list"></div>
      <button id="reset-button" class="reset-button" type="button">새 대화 시작</button>
    </aside>

    <main class="chat-panel">
      <header class="chat-header"><h1>문서와 대화하기</h1><p>업로드한 PDF 안에서 근거를 찾아 답합니다.</p></header>
      <section id="messages" class="messages" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">✦</div>
          <h2>무엇을 찾아볼까요?</h2>
          <p>왼쪽에서 PDF를 업로드한 뒤 문서 내용에 관해 질문해 보세요.</p>
        </div>
      </section>
      <form id="chat-form" class="composer">
        <textarea id="message-input" rows="1" placeholder="PDF 내용에 관해 질문하세요" aria-label="질문"></textarea>
        <button id="send-button" type="submit" aria-label="전송">↑</button>
      </form>
      <p class="footer-note">답변은 업로드한 문서의 검색 결과에만 근거합니다.</p>
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
